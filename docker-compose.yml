services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.local
    environment:
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 5432
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_USER: gamelo_user
      POSTGRES_PASSWORD: 18302112aA
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: