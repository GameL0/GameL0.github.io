<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Mensagens | Arthur Melo</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-[#001233] min-h-screen font-sans">

    <!-- Tela de Login -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
      <div class="bg-[#001a4d] border border-[#002878] rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <h1 class="text-2xl font-bold text-white text-center mb-2">🔐 Admin</h1>
        <p class="text-gray-400 text-center text-sm mb-6">Digite a senha de acesso</p>

        <form id="login-form">
          <input
            id="senha-input"
            type="password"
            placeholder="Senha"
            class="w-full bg-[#000d1a] border border-[#002878] text-white px-4 py-3 rounded-lg mb-4
                   focus:outline-none focus:border-[#3a86ff] transition-colors"
          />
          <p id="login-erro" class="text-red-400 text-sm mb-3 hidden">Senha incorreta</p>
          <button
            type="submit"
            class="w-full bg-[#3a86ff] hover:bg-[#2b6ed9] text-white font-semibold py-3 rounded-lg
                   transition-colors cursor-pointer"
          >
            Entrar
          </button>
        </form>
      </div>
    </div>

    <!-- Conteúdo Admin (escondido até o login) -->
    <div id="admin-content" class="hidden">
      <div class="max-w-4xl mx-auto px-4 py-12">

        <!-- Cabeçalho -->
        <div class="flex items-center justify-between mb-10">
          <div>
            <h1 class="text-3xl font-bold text-white">📬 Mensagens Recebidas</h1>
            <p id="contador" class="text-gray-400 mt-1 text-sm">Carregando...</p>
          </div>
          <div class="flex gap-3">
            <button
              id="btn-atualizar"
              onclick="carregarMensagens()"
              class="bg-[#001a4d] border border-[#002878] text-white px-5 py-2 rounded-lg hover:bg-[#002878] transition-colors text-sm cursor-pointer"
            >
              🔄 Atualizar
            </button>
            <button
              id="btn-sair"
              onclick="fazerLogout()"
              class="bg-red-900/40 border border-red-800 text-red-400 hover:bg-red-700 hover:text-white px-5 py-2 rounded-lg transition-colors text-sm cursor-pointer"
            >
              🚪 Sair
            </button>
          </div>
        </div>

        <!-- Estado de carregando -->
        <div id="loading" class="text-center text-gray-400 py-20">
          Carregando mensagens...
        </div>

        <!-- Estado vazio -->
        <div id="vazio" class="hidden text-center text-gray-400 py-20">
          <p class="text-5xl mb-4">📭</p>
          <p class="text-xl">Nenhuma mensagem recebida ainda.</p>
        </div>

        <!-- Lista de mensagens -->
        <div id="lista-mensagens" class="hidden space-y-4"></div>

      </div>
    </div>

    <script type="module" src="../utils/admin.js"></script>
  </body>
</html>
